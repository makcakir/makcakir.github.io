<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mustafa Ali Akçakır</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1a1d20;
      --subtext-color: #6c757d;
      --accent-color: #0d6efd;
      --accent-glow: rgba(13, 110, 253, 0.2);
      --social-bg: #f1f3f5;
      --social-hover: #e9ecef;
      --border-color: rgba(0, 0, 0, 0.06);
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
      --card-border: 1px solid rgba(0, 0, 0, 0.05);
      --transition-speed: 0.3s;
    }

    /* Automatic Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f1115;
        --card-bg: #181b20;
        --text-color: #f8f9fa;
        --subtext-color: #9fa6ad;
        --accent-color: #3d8bfd;
        --accent-glow: rgba(61, 139, 253, 0.3);
        --social-bg: #242830;
        --social-hover: #2f3440;
        --border-color: rgba(255, 255, 255, 0.08);
        --shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.5), 0 4px 15px -2px rgba(0, 0, 0, 0.3);
        --card-border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    /* Manual Theme Overrides via Data Attribute */
    [data-theme="dark"] {
      --bg-color: #0f1115;
      --card-bg: #181b20;
      --text-color: #f8f9fa;
      --subtext-color: #9fa6ad;
      --accent-color: #3d8bfd;
      --accent-glow: rgba(61, 139, 253, 0.3);
      --social-bg: #242830;
      --social-hover: #2f3440;
      --border-color: rgba(255, 255, 255, 0.08);
      --shadow: 0 12px 35px -5px rgba(0, 0, 0, 0.5), 0 4px 15px -2px rgba(0, 0, 0, 0.3);
      --card-border: 1px solid rgba(255, 255, 255, 0.08);
    }

    [data-theme="light"] {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1a1d20;
      --subtext-color: #6c757d;
      --accent-color: #0d6efd;
      --accent-glow: rgba(13, 110, 253, 0.2);
      --social-bg: #f1f3f5;
      --social-hover: #e9ecef;
      --border-color: rgba(0, 0, 0, 0.06);
      --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
      --card-border: 1px solid rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
      position: relative;
    }

    /* Top Control Bar for Theme & Language Switcher */
    .controls-bar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    /* Animated Sliding Language Switcher */
    .lang-switcher {
      position: relative;
      background: var(--card-bg);
      border: var(--card-border);
      border-radius: 22px;
      padding: 3px;
      display: flex;
      align-items: center;
      box-shadow: var(--shadow);
      transition: background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    /* Sliding pill indicator background */
    .lang-switcher::before {
      content: "";
      position: absolute;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      background-color: var(--accent-color);
      border-radius: 18px;
      box-shadow: 0 2px 8px var(--accent-glow);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), background-color var(--transition-speed) ease;
      pointer-events: none;
    }

    .lang-switcher:has(#btnEn.active)::before {
      transform: translateX(0%);
    }

    .lang-switcher:has(#btnTr.active)::before {
      transform: translateX(100%);
    }

    .lang-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      color: var(--subtext-color);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 18px;
      cursor: pointer;
      transition: color 0.25s ease;
      line-height: 1;
    }

    .lang-btn:hover {
      color: var(--text-color);
    }

    .lang-btn.active {
      color: #ffffff;
    }

    .lang-btn:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 2px;
    }

    /* Theme Toggle Button */
    .theme-toggle {
      background: var(--card-bg);
      border: var(--card-border);
      color: var(--text-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, background-color var(--transition-speed) ease, border-color var(--transition-speed) ease;
    }

    .theme-toggle:hover {
      transform: scale(1.08);
    }

    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 3px;
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Main Profile Container & Card */
    .container {
      background: var(--card-bg);
      padding: 3rem 2.5rem;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: var(--card-border);
      text-align: center;
      max-width: 440px;
      width: 100%;
      position: relative;
      overflow: hidden;
      transition: background-color var(--transition-speed) ease, box-shadow var(--transition-speed) ease, border-color var(--transition-speed) ease;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem auto;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: var(--accent-color);
      padding: 3px;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.05);
      box-shadow: 0 12px 25px var(--accent-glow);
    }

    .avatar-placeholder {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--accent-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      user-select: none;
    }

    /* Reserved Dimensions to Prevent Layout Bouncing */
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity 0.2s ease;
      min-height: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .intro {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 0.6rem;
      line-height: 1.4;
      transition: opacity 0.2s ease;
      min-height: 1.54rem;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: pre-wrap;
    }

    .intro strong {
      color: var(--text-color);
      font-weight: 600;
    }

    .subtext {
      color: var(--subtext-color);
      font-size: 0.95rem;
      margin-top: 0;
      margin-bottom: 2.2rem;
      line-height: 1.5;
      transition: opacity 0.2s ease;
      min-height: 2.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fade-out {
      opacity: 0;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 1.25rem;
    }

    .social-links a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background-color: var(--social-bg);
      color: var(--text-color);
      text-decoration: none;
      position: relative;
      border: 1px solid var(--border-color);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background-color var(--transition-speed) ease, color var(--transition-speed) ease, border-color var(--transition-speed) ease, box-shadow 0.25s ease;
    }

    .social-links a:hover {
      transform: translateY(-4px) scale(1.05);
      background-color: var(--social-hover);
      color: var(--accent-color);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }

    .social-links a:focus-visible {
      outline: 2px solid var(--accent-color);
      outline-offset: 4px;
    }

    .social-links svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
      transition: transform 0.2s ease;
    }

    .social-links a:hover svg {
      transform: scale(1.1);
    }

    /* Tooltip Styling */
    .social-links a::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--text-color);
      color: var(--card-bg);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .social-links a:hover::after {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Top Control Bar (Language & Theme) -->
  <div class="controls-bar">
    <div class="lang-switcher" role="group" id="langGroup" aria-label="Language selection">
      <button type="button" class="lang-btn" id="btnEn" onclick="setLanguage('en')" aria-label="Switch to English">EN</button>
      <button type="button" class="lang-btn" id="btnTr" onclick="setLanguage('tr')" aria-label="Türkçe'ye geç">TR</button>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Light and Dark Mode" title="Toggle Light/Dark Theme">
      <svg id="themeIcon" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
      </svg>
    </button>
  </div>

  <main class="container">
    <div class="avatar-wrapper">
      <img 
        src="https://github.com/makcakir.png" 
        alt="Mustafa Ali Akçakır Profile Photo" 
        class="avatar-img"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
      />
      <div class="avatar-placeholder" style="display: none;" aria-hidden="true">
        MA
      </div>
    </div>

    <h1 id="headingText">Hello world 👋🏼</h1>
    <p class="intro" id="introText">This is&nbsp;<strong>Mustafa Ali Akçakır</strong></p>
    <p class="subtext" id="subtextText">You can find more information about me using the links below.</p>

    <div class="social-links">
      <a id="linkLinkedIn" href="https://www.linkedin.com/in/makcakir" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn Profile" title="LinkedIn" data-tooltip="LinkedIn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-.2063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>

      <a id="linkGitHub" href="https://github.com/makcakir" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profile" title="GitHub" data-tooltip="GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34-.46-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.87 1.52 2.34 1.07 2.91.83.1-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.92 0-1.11.38-2 1.03-2.71-.1-.25-.45-1.29.1-2.64 0 0 .84-.27 2.75 1.02.79-.22 1.65-.33 2.5-.33.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.35.2 2.39.1 2.64.65.71 1.03 1.6 1.03 2.71 0 3.82-2.34 4.66-4.57 4.91.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2z"/></svg>
      </a>

      <a id="linkTwitter" href="https://twitter.com/makcakir" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter) Profile" title="X (Twitter)" data-tooltip="X / Twitter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </div>
  </main>

  <script>
    const translations = {
      en: {
        heading: "Hello world 👋🏼",
        intro: "This is&nbsp;<strong>Mustafa Ali Akçakır</strong>",
        subtext: "You can find more information about me using the links below.",
        linkedInAria: "LinkedIn Profile",
        githubAria: "GitHub Profile",
        twitterAria: "X (Twitter) Profile",
        themeToggleTitle: "Toggle Light/Dark Theme",
        themeToggleAria: "Toggle Light and Dark Mode",
        langGroupAria: "Language selection",
        btnEnAria: "Switch to English",
        btnTrAria: "Türkçe'ye geç"
      },
      tr: {
        heading: "Merhaba dünya 👋🏼",
        intro: "Ben&nbsp;<strong>Mustafa Ali Akçakır</strong>",
        subtext: "Benim hakkımda daha fazla bilgiye aşağıdaki bağlantılardan ulaşabilirsiniz.",
        linkedInAria: "LinkedIn Profilim",
        githubAria: "GitHub Profilim",
        twitterAria: "X (Twitter) Profilim",
        themeToggleTitle: "Karanlık/Aydınlık Temayı Değiştir",
        themeToggleAria: "Karanlık ve Aydınlık Modu Aç/Kapat",
        langGroupAria: "Dil seçimi",
        btnEnAria: "İngilizceye geç",
        btnTrAria: "Türkçe dilinde kal"
      }
    };

    let currentLang = null;

    function setLanguage(lang, animate = true) {
      if (!translations[lang]) return;
      
      // Zaten seçili olan dile tekrar tıklandıysa hiçbir şey yapma
      if (currentLang === lang && animate) return;

      currentLang = lang;
      localStorage.setItem('user_lang', lang);

      document.getElementById('btnEn').classList.toggle('active', lang === 'en');
      document.getElementById('btnTr').classList.toggle('active', lang === 'tr');
      document.documentElement.setAttribute('lang', lang);

      const headingEl = document.getElementById('headingText');
      const introEl = document.getElementById('introText');
      const subtextEl = document.getElementById('subtextText');

      const applyTranslations = () => {
        const t = translations[lang];
        headingEl.textContent = t.heading;
        introEl.innerHTML = t.intro;
        subtextEl.textContent = t.subtext;

        document.getElementById('linkLinkedIn').setAttribute('aria-label', t.linkedInAria);
        document.getElementById('linkGitHub').setAttribute('aria-label', t.githubAria);
        document.getElementById('linkTwitter').setAttribute('aria-label', t.twitterAria);

        document.getElementById('themeToggle').setAttribute('aria-label', t.themeToggleAria);
        document.getElementById('themeToggle').setAttribute('title', t.themeToggleTitle);
        document.getElementById('langGroup').setAttribute('aria-label', t.langGroupAria);
        document.getElementById('btnEn').setAttribute('aria-label', t.btnEnAria);
        document.getElementById('btnTr').setAttribute('aria-label', t.btnTrAria);
      };

      if (animate) {
        [headingEl, introEl, subtextEl].forEach(el => el.classList.add('fade-out'));
        setTimeout(() => {
          applyTranslations();
          [headingEl, introEl, subtextEl].forEach(el => el.classList.remove('fade-out'));
        }, 150);
      } else {
        applyTranslations();
      }
    }

    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    
    const moonPath = "M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z";
    const sunPath = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-12.37c-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.38.39-1.02 0-1.41zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.02-.39-1.41 0z";

    function updateIcon(isDark) {
      themeIcon.querySelector('path').setAttribute('d', isDark ? sunPath : moonPath);
    }

    function isDarkMode() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      if (currentTheme) {
        return currentTheme === 'dark';
      }
      return window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    const initialLang = localStorage.getItem('user_lang') || (navigator.language.startsWith('tr') ? 'tr' : 'en');

    updateIcon(isDarkMode());
    setLanguage(initialLang, false);

    themeToggleBtn.addEventListener('click', () => {
      const currentlyDark = isDarkMode();
      const newTheme = currentlyDark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', newTheme);
      updateIcon(newTheme === 'dark');
    });

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!document.documentElement.hasAttribute('data-theme')) {
        updateIcon(e.matches);
      }
    });
  </script>
</body>
</html>
